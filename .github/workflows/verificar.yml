name: Testar configuração
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/verificar.yml"
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Conferir chave da Meta e endereço público
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          set -o pipefail
          node scripts/verificar.mjs 2>&1 | tee verificacao.txt || true
          date -u +"Testado em %Y-%m-%dT%H:%M:%SZ" >> verificacao.txt
      - name: Salvar resultado do teste
        run: |
          git config user.name "publicador-vr-pratas"
          git config user.email "publicador@users.noreply.github.com"
          git add verificacao.txt
          git diff --cached --quiet && exit 0
          git commit -m "Resultado do teste de configuração"
          git pull --rebase
          git push
