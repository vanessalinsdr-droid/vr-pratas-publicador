name: Buscar métricas
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: publicacao
  cancel-in-progress: false
jobs:
  metricas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ler métricas dos posts publicados
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: node scripts/metricas.mjs
      - name: Salvar métricas
        run: |
          git config user.name "publicador-vr-pratas"
          git config user.email "publicador@users.noreply.github.com"
          git add resultados
          git diff --cached --quiet && exit 0
          git commit -m "Métricas atualizadas"
          git pull --rebase
          git push
      - name: Avisar o painel
        if: always()
        run: node scripts/sincronizar.mjs enviar
