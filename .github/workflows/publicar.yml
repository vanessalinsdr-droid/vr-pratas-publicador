name: Publicar posts
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: write
  id-token: write
concurrency:
  group: publicacao
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Trazer os posts liberados no painel
        run: node scripts/sincronizar.mjs baixar
      - name: Guardar posts e artes
        run: |
          git config user.name "publicador-vr-pratas"
          git config user.email "publicador@users.noreply.github.com"
          git add -A fila midia resultados
          if ! git diff --cached --quiet; then
            git commit -m "Posts liberados no painel"
            git pull --rebase
            git push
          fi
          node scripts/sincronizar.mjs confirmar
      - name: Publicar o que já chegou no horário
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: node scripts/publicar.mjs
      - name: Salvar resultados
        if: always()
        run: |
          git config user.name "publicador-vr-pratas"
          git config user.email "publicador@users.noreply.github.com"
          git add resultados
          git diff --cached --quiet && exit 0
          git commit -m "Resultados da publicação"
          git pull --rebase
          git push
      - name: Avisar o painel
        if: always()
        run: node scripts/sincronizar.mjs enviar
      - name: Chamar a próxima rodada quando houver post esperando
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          s=$(node scripts/proxima.mjs || true)
          if [ -z "$s" ]; then echo "Nada esperando na fila."; exit 0; fi
          echo "Próxima rodada em ${s}s"
          sleep "$s"
          gh workflow run publicar.yml --repo "${{ github.repository }}" --ref main
