name: Publicar posts
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicacao
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publicar o que já chegou no horário
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: node scripts/publicar.mjs
      - name: Salvar resultados
        if: always()
        run: |
          git config user.name "publicador-vr-pratas"
          git config user.email "publicador@users.noreply.github.com"
          git add resultados
          git diff --cached --quiet && exit 0
          git commit -m "Resultados da publicação"
          git pull --rebase
          git push
